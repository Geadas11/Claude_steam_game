<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acordado?">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>Ainda estás acordado?</title>
<style>
:root { --bg:#000; --text:#e9e6e1; --dim:#a3a9b0; --faint:#858b93; --accent:#d9b26f; --danger:#e06c6c; --surf:#15181d; --surf2:#1e2228; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; touch-action:none; }
#scr { position:fixed; left:0; top:0; touch-action:none; background:#000; image-rendering:auto; }
.layer { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; gap:16px; background:#000; z-index:20; }
.layer h2 { margin:0; font-weight:500; font-size:24px; }
.layer p { color:var(--dim); margin:0; max-width:340px; }
.layer small { color:var(--faint); font-size:12px; max-width:340px; }
.btn { background:var(--accent); color:#111; border:0; border-radius:26px; padding:15px 30px; font-size:17px; font-weight:600; font-family:inherit; }
.btn:active { transform:scale(.97); }
.hidden { display:none !important; }
#msg { background:#000c; z-index:15; }
#tip { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); background:#1e2228f2; border-radius:16px; padding:12px 14px; font-size:13px; color:var(--dim); z-index:12; display:flex; gap:10px; align-items:center; }
#tip b { color:var(--text); font-weight:600; }
#tip button { background:none; border:0; color:var(--faint); font-size:20px; padding:0 4px; }
/* keyboard sheet */
#kbd { position:fixed; left:0; right:0; bottom:0; z-index:18; background:#15181df7; padding:12px 12px calc(env(safe-area-inset-bottom) + 12px); display:flex; gap:8px; align-items:flex-end; border-top:1px solid #2a2f37; }
#kbd input, #kbd textarea { flex:1; background:var(--surf2); color:var(--text); border:1px solid #2a2f37; border-radius:18px; padding:11px 14px; font:16px inherit; font-family:inherit; outline:none; -webkit-user-select:text; user-select:text; resize:none; }
#kbd textarea { min-height:44px; max-height:30vh; }
#kbd button { background:var(--accent); color:#111; border:0; border-radius:18px; padding:11px 16px; font-weight:600; font-family:inherit; font-size:15px; }
</style>
</head>
<body>
<canvas id="scr"></canvas>
<div id="gate" class="layer">
	<h2>Ainda estás acordado?</h2>
	<p>Este telemóvel passa a ser o telemóvel do Daniel.</p>
	<p>Mantém o ecrã ligado e o som alto. Se possível, auscultadores.</p>
	<button class="btn" id="go">Toca para começar</button>
	<small>Esta página não acede à tua câmara, microfone, contactos, ficheiros nem localização. Mostra apenas o telemóvel do jogo, que corre no teu computador.</small>
</div>
<div id="msg" class="layer hidden"><h2 id="mt"></h2><p id="mp"></p></div>
<div id="tip" class="hidden"><span id="tiptext"></span><button id="tipx" aria-label="Fechar">×</button></div>
<div id="kbd" class="hidden"><input id="kin" autocomplete="off" autocorrect="off" spellcheck="false"><textarea id="kta" class="hidden" rows="2"></textarea><button id="kok">OK</button></div>
<script>
"use strict";
const KEY = new URLSearchParams(location.search).get("k") || localStorage.getItem("k") || "";
if (KEY) try { localStorage.setItem("k", KEY); } catch (e) {}
const WS_URL = "ws://" + location.hostname + ":__WS_PORT__/";
const $ = (id) => document.getElementById(id);
const S = { ws: null, retry: 0, w: 0, h: 0, on: false, ctx: null, ring: null, kbd: null, box: { x: 0, y: 0, w: 1, h: 1 }, pending: null };
const cv = $("scr"), g = cv.getContext("2d");

// ---------------------------------------------------------------- screen
function layout() {
	const dpr = window.devicePixelRatio || 1;
	const vw = window.innerWidth, vh = window.innerHeight;
	const ar = S.w && S.h ? S.w / S.h : 420 / 880;
	let w = vw, h = vw / ar;
	if (h > vh) { h = vh; w = vh * ar; }
	S.box = { x: (vw - w) / 2, y: (vh - h) / 2, w, h };
	cv.style.left = S.box.x + "px"; cv.style.top = S.box.y + "px";
	cv.style.width = w + "px"; cv.style.height = h + "px";
	cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
	if (S.last) g.drawImage(S.last, 0, 0, cv.width, cv.height);
}
window.addEventListener("resize", layout);
async function frame(blob) {
	try {
		const bmp = await createImageBitmap(blob);
		if (S.last && S.last.close) S.last.close();
		S.last = bmp;
		g.imageSmoothingQuality = "high";
		g.drawImage(bmp, 0, 0, cv.width, cv.height);
	} catch (e) {}
}

// ---------------------------------------------------------------- touch
function pt(e) { return { x: (e.clientX - S.box.x) / S.box.w, y: (e.clientY - S.box.y) / S.box.h }; }
let down = false, moveQ = null;
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); down = true; cv.setPointerCapture(e.pointerId); const p = pt(e); send({ t: "touch", a: "down", x: p.x, y: p.y }); });
cv.addEventListener("pointermove", (e) => {
	if (!down) return; e.preventDefault(); moveQ = pt(e);
	if (!S.pending) S.pending = requestAnimationFrame(() => { S.pending = null; if (moveQ) send({ t: "touch", a: "move", x: moveQ.x, y: moveQ.y }); moveQ = null; });
});
const up = (a) => (e) => { if (!down) return; down = false; const p = pt(e); if (moveQ) { send({ t: "touch", a: "move", x: moveQ.x, y: moveQ.y }); moveQ = null; } send({ t: "touch", a, x: p.x, y: p.y }); };
cv.addEventListener("pointerup", up("up"));
cv.addEventListener("pointercancel", up("cancel"));
document.addEventListener("contextmenu", (e) => e.preventDefault());

// the phone's own back gesture / button = back on the game's phone
function armBack() { history.pushState({ b: 1 }, ""); }
window.addEventListener("popstate", () => { send({ t: "back" }); armBack(); });

// ---------------------------------------------------------------- keyboard
function kbd(e) {
	const box = $("kbd");
	if (!e.on) { box.classList.add("hidden"); S.kbd = null; return; }
	const field = e.multi ? $("kta") : $("kin");
	$("kta").classList.toggle("hidden", !e.multi); $("kin").classList.toggle("hidden", !!e.multi);
	field.value = e.text || ""; field.placeholder = e.hint || "Escreve aqui";
	if (!e.multi) { $("kin").type = e.secret ? "password" : "text"; $("kin").inputMode = e.digits ? "numeric" : "text"; }
	S.kbd = field;
	box.classList.remove("hidden");
	try { field.focus(); } catch (x) {}
}
$("kin").addEventListener("input", (e) => send({ t: "text", value: e.target.value }));
$("kta").addEventListener("input", (e) => send({ t: "text", value: e.target.value }));
$("kin").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send({ t: "enter" }); $("kin").blur(); } });
$("kok").onclick = () => { if (S.kbd === $("kin")) send({ t: "enter" }); if (S.kbd) S.kbd.blur(); $("kbd").classList.add("hidden"); };

// ---------------------------------------------------------------- sound / haptics
function actx() { if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)(); return S.ctx; }
function tone(freqs, dur, vol) {
	try {
		const c = actx(), t0 = c.currentTime;
		freqs.forEach((f, i) => {
			const o = c.createOscillator(), gn = c.createGain();
			o.frequency.value = f; o.type = "sine";
			gn.gain.setValueAtTime(0, t0 + i * dur); gn.gain.linearRampToValueAtTime(vol, t0 + i * dur + 0.01);
			gn.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur);
			o.connect(gn).connect(c.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.05);
		});
	} catch (e) {}
}
function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
function ring(on) {
	if (S.ring) { clearInterval(S.ring); S.ring = null; }
	if (!on) { vibrate(0); return; }
	const once = () => { tone([660, 880, 660, 880], 0.18, 0.2); vibrate([400, 200, 400]); };
	once(); S.ring = setInterval(once, 2200);
}

// ---------------------------------------------------------------- messages
function msg(title, text) { $("mt").textContent = title; $("mp").textContent = text || ""; $("msg").classList.toggle("hidden", !title); }
function onEvent(e) {
	switch (e.t) {
	case "screen":
		S.w = e.w; S.h = e.h; S.on = e.on; layout();
		msg(e.on ? "" : "À espera do jogo", e.on ? "" : "Começa ou continua o jogo no computador e escolhe «O meu telemóvel».");
		break;
	case "kbd": kbd(e); break;
	case "notif": vibrate([120, 80, 120]); tone([880, 1318], 0.12, 0.16); break;
	case "ring": ring(e.on); break;
	case "vibrate": vibrate(Array(Math.max(1, e.n || 1)).fill(0).flatMap(() => [180, 120])); break;
	}
}

// ---------------------------------------------------------------- socket
function send(o) { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(o)); }
function connect() {
	const ws = new WebSocket(WS_URL); ws.binaryType = "blob"; S.ws = ws;
	ws.onopen = () => { S.retry = 0; ws.send(JSON.stringify({ t: "hello", k: KEY })); msg("", ""); };
	ws.onmessage = (ev) => { if (typeof ev.data === "string") { try { onEvent(JSON.parse(ev.data)); } catch (err) {} } else frame(ev.data); };
	ws.onclose = (ev) => {
		ring(false);
		if (ev.code === 4001) { msg("Código inválido", "Lê outra vez o código QR que aparece no computador."); return; }
		msg("Sem ligação", "A tentar outra vez… Confirma que o jogo está aberto e que estás na mesma rede Wi-Fi.");
		S.retry = Math.min(S.retry + 1, 6); setTimeout(connect, 500 * S.retry);
	};
}
const standalone = window.matchMedia("(display-mode: fullscreen)").matches || window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
$("go").onclick = () => {
	try { actx().resume(); tone([440], 0.05, 0.01); } catch (e) {}
	vibrate(30);
	$("gate").classList.add("hidden");
	if (!standalone && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
	if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});
	const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
	if (ios && !standalone) {
		$("tiptext").innerHTML = "Para jogar sem a barra do Safari: <b>Partilhar → Adicionar ao ecrã principal</b> e abre o jogo pelo ícone.";
		$("tip").classList.remove("hidden");
	}
	armBack(); layout(); connect();
};
$("tipx").onclick = () => $("tip").classList.add("hidden");
document.addEventListener("visibilitychange", () => {
	if (!document.hidden) {
		if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});
		if (S.ws && S.ws.readyState > 1) connect(); else send({ t: "sync" });
	}
});
layout();
</script>
</body>
</html>
